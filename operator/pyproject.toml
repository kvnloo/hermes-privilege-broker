[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-privilege-operator-telegram"
version = "0.1.0"
description = "Separately packaged Telegram operator frontend for Hermes Privilege Broker"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["hermes-privilege-broker==0.1.0"]

[project.scripts]
hermes-privilege-operator-telegram = "hermes_privilege_operator.telegram:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hermes_privilege_operator*"]
