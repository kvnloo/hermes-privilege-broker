[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-privilege-broker"
version = "0.1.0"
description = "Linux-only split-authority typed privilege broker"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.scripts]
hermes-privilege-broker = "hermes_privilege_broker.cli:main"
hermes-privilege-broker-daemon = "hermes_privilege_broker.daemon:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "operator/src"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hermes_privilege_broker*"]
